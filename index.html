<!DOCTYPE html>
<html lang="en">

<head>
  <link rel="icon" href="images/favicon.ico" type="image/x-icon" />
  <title>Recipe Finder</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="styles/styles.css">
  <link rel="stylesheet" href="styles/backgrounds.css">
  <script src="script.js"></script>
</head>

<body>

  <nav class="navbar">
    <ul class="nav navbar-nav">
      <li class="active"><a href="#">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="catalog.php">Catalog</a></li>
      <li><a href="add-recipe.html">Add Recipe</a></li>
    </ul>
    <h2>Recipe Finder</h2>
    <img src="images/favicon.ico" alt="Recipe Finder logo" class="logo">
  </nav>

  <header id="food-array">
  </header>

  <div class="center_text">

    <h1>Welcome to Recipe Finder!</h1>
    <hr>
    <div class="section-container">
      <div class="section">
        <h3>Recipe of the Day</h3>

        <div id="demo">
          <!-- Recipe will be displayed here -->
        </div>
        <script>
          document.addEventListener("DOMContentLoaded", () => recipeOfDay());
        </script>
      </div>

      <div class="section">
        <h3>Try Something New</h3>
        <div id="random-recipe">
        </div>
        <script>
          document.addEventListener("DOMContentLoaded", () => {
            fetchRecipeOfDay();
            fetchRandomRecipe();

            document.getElementById("surprise-button").addEventListener("click", () => {
              fetchRandomRecipe();
            });
          });

          function fetchRecipeOfDay() {
            fetch("get-recipe.php?type=day")
              .then(res => res.json())
              .then(recipe => {
                document.getElementById("demo").innerHTML = recipeCardHTML(recipe);
              })
              .catch(() => {
                document.getElementById("demo").innerText = "Could not load Recipe of the Day.";
              });
          }

          function fetchRandomRecipe() {
            fetch("get-recipe.php?type=random")
              .then(res => res.json())
              .then(recipe => {
                document.getElementById("random-recipe").innerHTML = recipeCardHTML(recipe);
              })
              .catch(() => {
                document.getElementById("random-recipe").innerText = "Could not load random recipe.";
              });
          }

          function recipeCardHTML(recipe) {
            return `
    <a href="${recipe.page}">
      <section class="recipe-card">
        <img src="${recipe.image}" alt="${recipe.title}" />
        <div>
          <h3>${recipe.title}</h3>
          <p class="description">${recipe.description}</p>
        </div>
      </section>
    </a>
  `;
          }
        </script>
        <button id="surprise-button" class="btn">
          Surprise Me!
        </button>
      </div>

      <div class="section">
        <h3>Explore Meals</h3>
        <div class="center_buttons">
          <button onclick="catalogWithTag('breakfast')" class="btn">Breakfast</button>
          <button onclick="catalogWithTag('lunch')" class="btn">Lunch</button>
          <button onclick="catalogWithTag('dinner')" class="btn">Dinner</button>
          <button onclick="catalogWithTag('dessert')" class="btn">Dessert</button>
        </div>
      </div>

    </div>

  </div>

  <footer>
    <p>
    <p>&copy; 2025 Justin Gumbis & Siah Gertz. All rights reserved.</p>
    </p>
  </footer>

</body>

</html>
